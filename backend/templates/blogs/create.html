<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="brand" href="/">Blog App</a>
        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/logout">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container" style="max-width: 700px;">
      <section class="card auth-panel">
        <h2>Create Blog</h2>
        <form action="/blogs/new" method="post">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Blog title" required />
          </div>

          <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="8" placeholder="Write your blog content here..."></textarea>
          </div>

          <button type="submit">Create Post</button>
        </form>
      </section>
    </main>
  </body>
</html>
